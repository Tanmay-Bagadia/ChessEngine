<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanmayChess | Modern Analysis & Play GUI</title>
    <script src="/chess.min.js"></script>
    <script>
        if (typeof Chess === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"><\/script>');
        }
    </script>
    <style>
        :root {
            --bg-primary: #161512;
            --bg-secondary: #262421;
            --bg-tertiary: #363431;
            --accent: #629924;
            --accent-hover: #75b32e;
            --accent-blue: #3692e7;
            --text-main: #bababa;
            --text-bright: #ffffff;
            --board-light: #f0d9b5;
            --board-dark: #b58863;
            --highlight-select: rgba(20, 130, 230, 0.6);
            --highlight-last: rgba(155, 199, 0, 0.45);
            --highlight-check: rgba(235, 40, 40, 0.7);
            --border-color: #403d39;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-bright);
        }

        .badge {
            background: #2f6627;
            color: #8edc75;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .top-stats {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
        }

        .stat-item span {
            color: var(--text-bright);
            font-weight: 600;
        }

        main {
            display: flex;
            flex: 1;
            padding: 24px;
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Board Section */
        .board-container {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .eval-bar-wrapper {
            width: 30px;
            height: 560px;
            background: #222;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .eval-bar-black {
            width: 100%;
            background: #111;
            transition: height 0.3s ease;
        }

        .eval-bar-white {
            width: 100%;
            background: #eee;
            flex: 1;
        }

        .eval-text {
            position: absolute;
            bottom: 6px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.72rem;
            font-weight: 800;
            color: #111;
            text-shadow: 0 0 2px rgba(255,255,255,0.8);
            pointer-events: none;
        }

        .board-wrapper {
            position: relative;
        }

        .board {
            width: 560px;
            height: 560px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
            user-select: none;
        }

        .square {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        .square.selected { background-color: var(--highlight-select) !important; }
        .square.last-move { background-color: var(--highlight-last) !important; }
        .square.in-check { background-color: var(--highlight-check) !important; }

        /* Legal target indicator: dot for quiet moves */
        .square.legal-target::after {
            content: '';
            width: 20px;
            height: 20px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            pointer-events: none;
            position: absolute;
            z-index: 10;
        }

        /* Legal capture indicator: ring on capture squares */
        .square.legal-capture::after {
            content: '';
            width: 58px;
            height: 58px;
            border: 6px solid rgba(0, 0, 0, 0.28);
            border-radius: 50%;
            pointer-events: none;
            position: absolute;
            z-index: 10;
        }

        .piece {
            width: 62px;
            height: 62px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 5;
            transition: transform 0.1s ease;
        }

        .piece:hover {
            transform: scale(1.04);
        }

        /* Promotion Modal */
        .promo-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-secondary);
            border: 2px solid var(--accent);
            border-radius: 8px;
            padding: 16px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
        }

        .promo-pieces {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .promo-piece-btn {
            width: 60px;
            height: 60px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            border-radius: 6px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            transition: all 0.15s ease;
        }

        .promo-piece-btn:hover {
            background-color: #4a4743;
            transform: scale(1.1);
        }

        /* Game Over Banner */
        .game-status-banner {
            display: none;
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
        }
        .banner-win { background: #2f6627; color: #b1f0a8; border: 1px solid #439637; }
        .banner-loss { background: #782828; color: #f0a8a8; border: 1px solid #a63838; }
        .banner-draw { background: #444; color: #ddd; border: 1px solid #666; }

        /* Right Panel */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 380px;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
        }

        .card-header {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-bright);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* MultiPV lines */
        .multipv-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .multipv-item {
            background: var(--bg-tertiary);
            padding: 10px 12px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.85rem;
            border-left: 4px solid #555;
        }

        .multipv-item.top {
            border-left-color: var(--accent);
            background: #2b3524;
        }

        .multipv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-pill {
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .score-pos { background: #2f6627; color: #b1f0a8; }
        .score-neg { background: #782828; color: #f0a8a8; }
        .score-even { background: #444; color: #ddd; }

        .pv-moves {
            color: #ddd;
            font-family: monospace;
            font-size: 0.82rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Move list table */
        .moves-box {
            height: 180px;
            overflow-y: auto;
            background: var(--bg-primary);
            border-radius: 4px;
            padding: 8px;
            font-size: 0.85rem;
            font-family: monospace;
        }

        .move-row {
            display: flex;
            padding: 4px 6px;
            border-radius: 3px;
        }

        .move-row:nth-child(even) { background: rgba(255,255,255,0.02); }
        .move-num { width: 45px; color: #777; }
        .move-white, .move-black { flex: 1; color: var(--text-bright); }

        /* Controls */
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        button {
            background-color: var(--bg-tertiary);
            color: var(--text-bright);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.15s ease;
        }

        button:hover {
            background-color: #4a4743;
            border-color: #666;
        }

        button.primary {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        button.primary:hover {
            background-color: var(--accent-hover);
        }

        button.active {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .fen-input {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: #eee;
            padding: 8px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
            margin-top: 8px;
        }

        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        select {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <span>♟️ TanmayChess</span>
            <span class="badge" id="engine-name-badge">Classical PeSTO Engine</span>
        </div>
        <div class="top-stats">
            <div class="stat-item">Eval: <span id="stat-score">+0.0</span></div>
            <div class="stat-item">Depth: <span id="stat-depth">0</span></div>
            <div class="stat-item">Nodes: <span id="stat-nodes">0</span></div>
            <div class="stat-item">NPS: <span id="stat-nps">0</span></div>
        </div>
    </header>

    <main>
        <!-- Left: Chessboard + Eval Bar -->
        <div class="board-container">
            <div class="eval-bar-wrapper">
                <div class="eval-bar-black" id="eval-bar-black" style="height: 50%;"></div>
                <div class="eval-bar-white"></div>
                <div class="eval-text" id="eval-bar-text">+0.0</div>
            </div>

            <div class="board-wrapper">
                <div class="board" id="board"></div>

                <!-- Promotion Modal -->
                <div class="promo-modal" id="promo-modal">
                    <div style="font-weight:700; color:#fff; font-size:0.95rem;">Choose Promotion</div>
                    <div class="promo-pieces" id="promo-pieces-container"></div>
                </div>

                <div class="game-status-banner" id="game-status-banner"></div>

                <div class="btn-group" style="margin-top: 12px; justify-content: space-between;">
                    <div>
                        <button onclick="newGame()">New Game</button>
                        <button onclick="flipBoard()">Flip Board</button>
                        <button onclick="undoMove()">Undo</button>
                    </div>
                    <div>
                        <button id="btn-toggle-engine" class="primary active" onclick="toggleEnginePlay()">Play Engine: ON</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: MultiPV Analysis & Moves -->
        <div class="sidebar">
            <!-- MultiPV Analysis -->
            <div class="card">
                <div class="card-header">
                    <span>⚡ Top Engine Analysis (MultiPV)</span>
                    <span style="font-size: 0.75rem; color: #8edc75;" id="engine-status-tag">Ready</span>
                </div>
                <div class="multipv-list" id="multipv-container">
                    <div class="multipv-item top">
                        <div class="multipv-header">
                            <span style="font-weight: 700;">1. Ready</span>
                            <span class="score-pill score-even">+0.00</span>
                        </div>
                        <div class="pv-moves">Make a move to start analysis</div>
                    </div>
                </div>
            </div>

            <!-- Move History -->
            <div class="card">
                <div class="card-header">Move History (SAN)</div>
                <div class="moves-box" id="moves-box"></div>
            </div>

            <!-- Settings & FEN -->
            <div class="card">
                <div class="card-header">Position & Engine Controls</div>
                <div class="switch-container">
                    <span>Evaluation Mode:</span>
                    <select id="select-eval-mode" onchange="changeEvalMode(this.value)">
                        <option value="pesto" selected>Hand-Crafted (PeSTO - Recommended)</option>
                        <option value="nnue">Simple768 NNUE (Experimental)</option>
                    </select>
                </div>
                <div class="switch-container">
                    <span>Engine Think Time:</span>
                    <select id="select-think-time">
                        <option value="200">Fast (200 ms)</option>
                        <option value="500" selected>Normal (500 ms)</option>
                        <option value="1000">Deep (1000 ms)</option>
                        <option value="2000">Master (2000 ms)</option>
                    </select>
                </div>
                <div class="switch-container">
                    <span>MultiPV Lines:</span>
                    <select id="select-multipv" onchange="changeMultiPV(this.value)">
                        <option value="1">1 Line</option>
                        <option value="2">2 Lines</option>
                        <option value="3" selected>3 Lines</option>
                        <option value="5">5 Lines</option>
                    </select>
                </div>
                <input type="text" class="fen-input" id="fen-input" placeholder="Paste FEN here..." onchange="loadCustomFen(this.value)">
            </div>
        </div>
    </main>

    <script>
        function getPieceImage(type, color) {
            return `/pieces/${color}${type.toUpperCase()}.svg`;
        }

        // Initialize chess.js engine instance
        let game = new Chess();
        let selectedSquare = null;
        let legalTargets = [];
        let isFlipped = false;
        let lastMove = null;
        let playAgainstEngine = true;
        let playerColor = 'w'; // 'w' or 'b'
        let pendingPromotion = null;
        let multiPVLines = {};

        function getPieceImage(type, color) {
            // In our map: lowercase for white, uppercase for black
            const key = (color === 'w') ? type.toLowerCase() : type.toUpperCase();
            return PIECE_IMAGES[key];
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            const boardData = game.board(); // 8x8 array: rank 8 down to 1
            const inCheckSquare = game.in_check() ? getKingSquare(game.turn()) : null;

            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const row = isFlipped ? (7 - r) : r;
                    const col = isFlipped ? (7 - f) : f;
                    const squareCoord = String.fromCharCode('a'.charCodeAt(0) + col) + (8 - row);

                    const isDark = (row + col) % 2 === 1;
                    const sqEl = document.createElement('div');
                    sqEl.className = `square ${isDark ? 'dark' : 'light'}`;
                    sqEl.dataset.coord = squareCoord;

                    if (selectedSquare === squareCoord) sqEl.classList.add('selected');
                    if (lastMove && (lastMove.from === squareCoord || lastMove.to === squareCoord)) {
                        sqEl.classList.add('last-move');
                    }
                    if (inCheckSquare === squareCoord) {
                        sqEl.classList.add('in-check');
                    }

                    // Legal destination indicators
                    const targetMove = legalTargets.find(m => m.to === squareCoord);
                    if (targetMove) {
                        if (targetMove.captured || targetMove.flags.includes('e')) {
                            sqEl.classList.add('legal-capture');
                        } else {
                            sqEl.classList.add('legal-target');
                        }
                    }

                    const piece = boardData[row][col];
                    if (piece) {
                        const pieceEl = document.createElement('div');
                        pieceEl.className = 'piece';
                        pieceEl.style.backgroundImage = `url('${getPieceImage(piece.type, piece.color)}')`;
                        sqEl.appendChild(pieceEl);
                    }

                    sqEl.onclick = () => onSquareClick(squareCoord);
                    boardEl.appendChild(sqEl);
                }
            }

            checkGameOver();
        }

        function getKingSquare(color) {
            const boardData = game.board();
            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const p = boardData[r][f];
                    if (p && p.type === 'k' && p.color === color) {
                        return String.fromCharCode('a'.charCodeAt(0) + f) + (8 - r);
                    }
                }
            }
            return null;
        }

        function onSquareClick(coord) {
            if (game.game_over()) return;

            // If it's engine's turn and playing vs engine, block human clicks
            if (playAgainstEngine && game.turn() !== playerColor) return;

            if (selectedSquare === null) {
                // Select a piece only if it belongs to current player
                const piece = game.get(coord);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = coord;
                    legalTargets = game.moves({ square: coord, verbose: true });
                    renderBoard();
                }
            } else {
                if (selectedSquare === coord) {
                    // Clicked same square: deselect
                    selectedSquare = null;
                    legalTargets = [];
                    renderBoard();
                    return;
                }

                // Check if target is a legal move
                const moveObj = legalTargets.find(m => m.to === coord);
                if (moveObj) {
                    if (moveObj.flags.includes('p')) {
                        // Promotion move: show picker
                        showPromotionModal(selectedSquare, coord);
                        return;
                    }

                    executeMove({ from: selectedSquare, to: coord });
                    selectedSquare = null;
                    legalTargets = [];
                } else {
                    // Clicked another friendly piece: change selection
                    const piece = game.get(coord);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = coord;
                        legalTargets = game.moves({ square: coord, verbose: true });
                        renderBoard();
                    } else {
                        selectedSquare = null;
                        legalTargets = [];
                        renderBoard();
                    }
                }
            }
        }

        function executeMove(moveData) {
            const moveRes = game.move(moveData);
            if (!moveRes) return false;

            lastMove = { from: moveRes.from, to: moveRes.to };
            renderBoard();
            updateMovesBox();
            document.getElementById('fen-input').value = game.fen();

            sendPositionToEngine();

            if (playAgainstEngine && !game.game_over() && game.turn() !== playerColor) {
                requestEngineMove();
            }
            return true;
        }

        function showPromotionModal(from, to) {
            pendingPromotion = { from, to };
            const modal = document.getElementById('promo-modal');
            const container = document.getElementById('promo-pieces-container');
            container.innerHTML = '';

            const pieces = ['q', 'r', 'b', 'n'];
            const color = game.turn();
            pieces.forEach(p => {
                const btn = document.createElement('div');
                btn.className = 'promo-piece-btn';
                btn.style.backgroundImage = `url('${getPieceImage(p, color)}')`;
                btn.onclick = () => {
                    modal.style.display = 'none';
                    executeMove({ from: pendingPromotion.from, to: pendingPromotion.to, promotion: p });
                    pendingPromotion = null;
                    selectedSquare = null;
                    legalTargets = [];
                };
                container.appendChild(btn);
            });

            modal.style.display = 'block';
        }

        function updateMovesBox() {
            const box = document.getElementById('moves-box');
            box.innerHTML = '';
            const history = game.history();

            for (let i = 0; i < history.length; i += 2) {
                const row = document.createElement('div');
                row.className = 'move-row';
                row.innerHTML = `
                    <span class="move-num">${Math.floor(i / 2) + 1}.</span>
                    <span class="move-white">${history[i]}</span>
                    <span class="move-black">${history[i + 1] || ''}</span>
                `;
                box.appendChild(row);
            }
            box.scrollTop = box.scrollHeight;
        }

        function sendPositionToEngine() {
            const history = game.history({ verbose: true });
            let uciMoves = history.map(m => m.from + m.to + (m.promotion || '')).join(' ');

            if (uciMoves) {
                sendUciCommand(`position startpos moves ${uciMoves}`);
            } else {
                sendUciCommand('position startpos');
            }
        }

        function requestEngineMove() {
            document.getElementById('engine-status-tag').textContent = "Thinking...";
            document.getElementById('engine-status-tag').style.color = "#e5c07b";

            const thinkTime = document.getElementById('select-think-time').value;
            sendUciCommand(`go movetime ${thinkTime}`);
        }

        function flipBoard() {
            isFlipped = !isFlipped;
            playerColor = isFlipped ? 'b' : 'w';
            renderBoard();

            // If player switched to Black and it's White's turn, engine plays first move
            if (playAgainstEngine && game.turn() !== playerColor && !game.game_over()) {
                requestEngineMove();
            }
        }

        function newGame() {
            game = new Chess();
            selectedSquare = null;
            legalTargets = [];
            lastMove = null;
            multiPVLines = {};
            document.getElementById('multipv-container').innerHTML = '';
            document.getElementById('promo-modal').style.display = 'none';
            document.getElementById('game-status-banner').style.display = 'none';
            document.getElementById('fen-input').value = game.fen();

            sendUciCommand('ucinewgame');
            sendUciCommand('position startpos');
            renderBoard();
            updateMovesBox();

            if (playAgainstEngine && playerColor === 'b') {
                requestEngineMove();
            }
        }

        function undoMove() {
            if (game.history().length === 0) return;

            // In play mode, undo 2 plies (engine move + human move)
            if (playAgainstEngine && game.history().length >= 2) {
                game.undo();
                game.undo();
            } else {
                game.undo();
            }

            const history = game.history({ verbose: true });
            lastMove = history.length ? { from: history[history.length - 1].from, to: history[history.length - 1].to } : null;
            selectedSquare = null;
            legalTargets = [];

            renderBoard();
            updateMovesBox();
            document.getElementById('fen-input').value = game.fen();
            sendPositionToEngine();
        }

        function toggleEnginePlay() {
            playAgainstEngine = !playAgainstEngine;
            const btn = document.getElementById('btn-toggle-engine');
            btn.textContent = playAgainstEngine ? "Play Engine: ON" : "Play Engine: OFF";
            btn.className = playAgainstEngine ? "primary active" : "";

            if (playAgainstEngine && game.turn() !== playerColor && !game.game_over()) {
                requestEngineMove();
            }
        }

        function changeEvalMode(val) {
            const isNNUE = (val === 'nnue');
            sendUciCommand(`setoption name UseNNUE value ${isNNUE}`);
            document.getElementById('engine-name-badge').textContent = isNNUE ? "Simple768 NNUE" : "Classical PeSTO Engine";
            sendPositionToEngine();
            sendUciCommand('go depth 8');
        }

        function changeMultiPV(val) {
            sendUciCommand(`setoption name MultiPV value ${val}`);
            sendPositionToEngine();
            sendUciCommand('go depth 8');
        }

        function loadCustomFen(fen) {
            if (!fen.trim()) return;
            const valid = game.load(fen.trim());
            if (!valid) {
                alert("Invalid FEN string!");
                return;
            }
            selectedSquare = null;
            legalTargets = [];
            lastMove = null;
            renderBoard();
            updateMovesBox();
            sendUciCommand(`position fen ${fen.trim()}`);
            sendUciCommand('go depth 8');
        }

        function checkGameOver() {
            const banner = document.getElementById('game-status-banner');
            if (game.in_checkmate()) {
                const winner = (game.turn() === 'w') ? 'Black' : 'White';
                banner.className = `game-status-banner ${winner === (playerColor === 'w' ? 'White' : 'Black') ? 'banner-win' : 'banner-loss'}`;
                banner.textContent = `🏆 Checkmate! ${winner} wins.`;
                banner.style.display = 'block';
            } else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition() || game.insufficient_material()) {
                banner.className = 'game-status-banner banner-draw';
                let reason = "Draw";
                if (game.in_stalemate()) reason = "Stalemate";
                else if (game.in_threefold_repetition()) reason = "Threefold Repetition";
                else if (game.insufficient_material()) reason = "Insufficient Material";
                banner.textContent = `🤝 Game Drawn by ${reason}.`;
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        }

        async function sendUciCommand(cmd) {
            try {
                await fetch('/api/cmd', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cmd })
                });
            } catch (e) {
                console.error("Failed to send command:", e);
            }
        }

        // Server-Sent Events (SSE) listener
        const sse = new EventSource('/api/stream');
        sse.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'info' && data.info) {
                const info = data.info;
                if (info.depth) document.getElementById('stat-depth').textContent = info.depth;
                if (info.nodes) document.getElementById('stat-nodes').textContent = info.nodes.toLocaleString();
                if (info.nps) document.getElementById('stat-nps').textContent = (info.nps / 1000).toFixed(0) + 'k';

                if (info.score !== undefined) {
                    let scoreTxt = (info.score / 100).toFixed(2);
                    if (info.scoreType === 'mate') scoreTxt = 'M' + info.score;
                    else if (info.score > 0) scoreTxt = '+' + scoreTxt;
                    document.getElementById('stat-score').textContent = scoreTxt;
                    updateEvalBar(info.score, info.scoreType);
                }

                if (info.multipv !== undefined) {
                    multiPVLines[info.multipv] = info;
                    renderMultiPV();
                }
            } else if (data.type === 'bestmove') {
                document.getElementById('engine-status-tag').textContent = "Ready";
                document.getElementById('engine-status-tag').style.color = "#8edc75";

                if (playAgainstEngine && game.turn() !== playerColor && !game.game_over()) {
                    const m = data.move;
                    if (m && m !== '(none)') {
                        const from = m.slice(0, 2);
                        const to = m.slice(2, 4);
                        const promo = m.length > 4 ? m[4] : undefined;

                        executeMove({ from, to, promotion: promo });
                    }
                }
            }
        };

        function updateEvalBar(score, type) {
            let winPercent = 50;
            if (type === 'mate') {
                winPercent = score > 0 ? 100 : 0;
            } else {
                winPercent = 100 / (1 + Math.pow(10, -score / 400));
            }
            winPercent = Math.max(4, Math.min(96, winPercent));
            const blackPercent = 100 - winPercent;

            document.getElementById('eval-bar-black').style.height = `${blackPercent}%`;
            let txt = (score / 100).toFixed(1);
            if (type === 'mate') txt = 'M' + score;
            else if (score > 0) txt = '+' + txt;
            document.getElementById('eval-bar-text').textContent = txt;
        }

        function renderMultiPV() {
            const container = document.getElementById('multipv-container');
            container.innerHTML = '';

            const keys = Object.keys(multiPVLines).sort((a,b) => parseInt(a) - parseInt(b));
            for (const k of keys) {
                const line = multiPVLines[k];
                const item = document.createElement('div');
                item.className = `multipv-item ${k === '1' ? 'top' : ''}`;

                let scoreClass = 'score-even';
                let scoreTxt = '+0.00';
                if (line.score > 15) scoreClass = 'score-pos';
                else if (line.score < -15) scoreClass = 'score-neg';

                if (line.score !== undefined) {
                    scoreTxt = (line.score / 100).toFixed(2);
                    if (line.scoreType === 'mate') scoreTxt = 'M' + line.score;
                    else if (line.score > 0) scoreTxt = '+' + scoreTxt;
                }

                item.innerHTML = `
                    <div class="multipv-header">
                        <span style="font-weight: 700;">Line ${k} (d${line.depth || 0})</span>
                        <span class="score-pill ${scoreClass}">${scoreTxt}</span>
                    </div>
                    <div class="pv-moves">${line.pv || ''}</div>
                `;
                container.appendChild(item);
            }
        }

        // Initialize board
        renderBoard();
        document.getElementById('fen-input').value = game.fen();
        sendUciCommand('setoption name UseNNUE value false');
        sendUciCommand('setoption name MultiPV value 3');
        sendPositionToEngine();
        sendUciCommand('go depth 8');
    </script>
</body>
</html>
